name: Build Perpustakaan Windows Offline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare application files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\app | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','build') } | Copy-Item -Destination build\app -Recurse -Force
          Remove-Item build\app\.github -Recurse -Force -ErrorAction SilentlyContinue

      - name: Verify offline files
        shell: pwsh
        run: |
          if (-not (Test-Path build\app\offline\database.sql)) { throw 'offline/database.sql tidak ditemukan.' }
          if (-not (Test-Path build\app\offline\launcher\PerpustakaanLauncher.csproj)) { throw 'Launcher project tidak ditemukan.' }
          if (-not (Test-Path build\app\config\koneksi.php)) { throw 'config/koneksi.php tidak ditemukan.' }

      - name: Install PHP for build
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, mbstring, mysqli, openssl, pdo_mysql
          tools: composer

      - name: Bundle PHP runtime
        shell: pwsh
        run: |
          $phpExe = (Get-Command php).Source
          $phpHome = Split-Path $phpExe -Parent
          New-Item -ItemType Directory -Force -Path build\php | Out-Null
          Copy-Item "$phpHome\*" build\php -Recurse -Force
          if (Test-Path build\php\php.ini-development) {
            Copy-Item build\php\php.ini-development build\php\php.ini -Force
            $p = 'build\php\php.ini'
            (Get-Content $p) -replace ';extension=curl','extension=curl' -replace ';extension=fileinfo','extension=fileinfo' -replace ';extension=mbstring','extension=mbstring' -replace ';extension=mysqli','extension=mysqli' -replace ';extension=openssl','extension=openssl' -replace ';extension=pdo_mysql','extension=pdo_mysql' -replace ';extension_dir = "ext"','extension_dir = "ext"' | Set-Content $p
            Add-Content $p "`ndate.timezone = Asia/Jakarta"
          }

      - name: Download MariaDB portable
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dlm.mariadb.com/4707361/MariaDB/mariadb-11.8.8/winx64-packages/mariadb-11.8.8-winx64.zip" -OutFile mariadb.zip
          Expand-Archive mariadb.zip -DestinationPath build\mariadb-temp -Force
          $dir = Get-ChildItem build\mariadb-temp -Directory | Select-Object -First 1
          if (-not $dir) { throw 'Paket MariaDB tidak dapat diekstrak.' }
          New-Item -ItemType Directory -Force -Path build\mariadb | Out-Null
          Move-Item "$($dir.FullName)\*" build\mariadb -Force
          Remove-Item mariadb.zip, build\mariadb-temp -Recurse -Force

      - name: Download Bootstrap assets for offline runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\app\assets\css, build\app\assets\js, build\app\assets\fonts | Out-Null
          Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" -OutFile build\app\assets\css\bootstrap.min.css
          Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" -OutFile build\app\assets\js\bootstrap.bundle.min.js
          Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" -OutFile build\app\assets\css\bootstrap-icons.min.css
          Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/fonts/bootstrap-icons.woff2" -OutFile build\app\assets\fonts\bootstrap-icons.woff2

      - name: Build launcher
        shell: pwsh
        run: |
          dotnet publish build\app\offline\launcher\PerpustakaanLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o build\launcher
          Copy-Item build\launcher\Perpustakaan.exe build\Perpustakaan.exe -Force

      - name: Remove build-only source
        shell: pwsh
        run: |
          Remove-Item build\app\offline\launcher -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build\launcher -Recurse -Force -ErrorAction SilentlyContinue

      - name: Package portable application
        shell: pwsh
        run: |
          Compress-Archive -Path build\* -DestinationPath Perpustakaan-Garba-Sastra-Windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perpustakaan-Garba-Sastra-Windows
          path: Perpustakaan-Garba-Sastra-Windows.zip
